<div #painel class="notificacoes" popover="manual" aria-label="Notificações">
  @for (item of notificacoes.itens(); track item.id) {
    <article class="notificacao" [class.erro]="item.tipo === 'erro'">
      <div [attr.role]="item.tipo === 'erro' ? 'alert' : 'status'">
        <strong>{{ item.tipo === 'erro' ? 'Erro' : 'Sucesso' }}</strong>
        <p>{{ item.mensagem }}</p>
      </div>
      <button type="button" aria-label="Fechar notificação" (click)="notificacoes.fechar(item.id)">
        <svg class="icone" aria-hidden="true"><use href="icons/bootstrap-icons.svg#x-lg" /></svg>
      </button>
    </article>
  }
</div>
